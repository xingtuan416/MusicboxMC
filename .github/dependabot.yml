version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - electron
          - electron-builder
      test-stack:
        patterns:
          - vitest
          - vite
          - '@vitest/*'
      lint-and-types:
        patterns:
          - eslint
          - '@eslint/js'
          - eslint-config-prettier
          - prettier
          - typescript
          - typescript-eslint
          - '@types/node'
      runtime:
        patterns:
          - '@tonejs/midi'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
